<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>stxt-press</title>
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
	<link rel="preload" href="/assets/russo-one-latin.woff2" as="font" type="font/woff2" crossorigin>
	<!-- The theme, before the first paint: the one chosen, or the system's (theme.ts) -->
	<script src="/assets/theme.js"></script>
	<link rel="stylesheet" href="/assets/editor.css">
	<script src="/assets/editor.js" defer></script>
</head>
<body class="editor">
	<header class="bar">
		<a class="brand" id="home" href="/" title="The index of the server"><span class="brand-name">STXT</span> <span class="brand-sub">Press</span></a>
		<span id="place" class="place"></span>
		<div class="actions">
			<button type="button" id="save" title="Save the files (Ctrl+S)" hidden>Save</button>
			<button type="button" id="fill">Fill</button>
			<button type="button" id="preview">Preview</button>
			<button type="button" id="pdf">PDF</button>
			<label><input type="checkbox" id="debug"> Outlines</label>
			<a id="download" class="download" hidden>Download</a>
		</div>
		<button type="button" id="token" class="quiet">Token</button>
		<button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Dark theme" title="Switch to the dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg></button>
	</header>
	<main class="workspace">
		<section class="inputs" aria-label="Input">
			<details id="print" class="print" hidden>
				<summary><code id="print-url"></code></summary>
				<pre id="curl"></pre>
				<button type="button" id="copy-curl" class="quiet small">Copy curl</button>
			</details>
			<div id="tabs" class="tabs" role="tablist" aria-label="Files"></div>
			<div id="panels"></div>
		</section>
		<section class="output" aria-label="Output">
			<div id="message" role="status"></div>
			<div id="view">
				<div id="filled-panel" hidden>
					<h2>Filled document</h2>
					<div id="filled"></div>
				</div>
				<div id="pages" hidden></div>
				<iframe id="pdf-frame" title="PDF" hidden></iframe>
			</div>
		</section>
	</main>
</body>
</html>
