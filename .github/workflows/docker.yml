# The Docker image, published to ghcr.io/stxt-lang/stxt-press with the version of the pom as its tag, and latest too
# when a release that is not a prerelease is published. Only by hand or with a release: publishing is a decision, not
# a push. A run by hand does not move latest, which is always the image of the last release.
name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      # As in ci.yml: mvn package needs stxt-pdf next to stxt-press (../stxt-pdf), at the tag of the version the pom
      # depends on.
      - uses: actions/checkout@v4
        with:
          path: stxt-press
      - name: Versions in the pom
        id: pom
        run: |
          pdf=$(sed -n '/<artifactId>stxt-pdf<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;}' stxt-press/pom.xml)
          press=$(sed -n '/<artifactId>stxt-press<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;}' stxt-press/pom.xml)
          test -n "$pdf" && test -n "$press"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
          echo "press=$press" >> "$GITHUB_OUTPUT"
          tags="ghcr.io/stxt-lang/stxt-press:$press"
          if [ "${{ github.event_name }}" = release ] && [ "${{ github.event.release.prerelease }}" = false ]; then
              tags="$tags,ghcr.io/stxt-lang/stxt-press:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      # A release publishes the image of its own version only.
      - name: Tag of the release
        if: github.event_name == 'release'
        run: test "${{ github.event.release.tag_name }}" = "v${{ steps.pom.outputs.press }}"
      - uses: actions/checkout@v4
        with:
          repository: stxt-lang/stxt-pdf
          ref: v${{ steps.pom.outputs.pdf }}
          path: stxt-pdf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: stxt-press/pom.xml
      # With the tests: the image takes the server/stxt-press.jar that this build leaves, not the one committed.
      - name: Jar
        working-directory: stxt-press
        run: mvn -B package -Dnpm.install=ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: stxt-press
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.pom.outputs.press }}
          tags: ${{ steps.pom.outputs.tags }}
          push: true
